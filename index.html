<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gem Quest Online</title>
<style>body{margin:0;font-family:Arial;background:#160725;color:#fff}main{max-width:900px;margin:auto;padding:20px}.box{background:#29103f;padding:20px;border-radius:18px;margin:15px 0}input,button{padding:12px;margin:5px;border-radius:10px}input{background:#12061c;color:white;border:1px solid #65427c}button{cursor:pointer;border:0;font-weight:bold}.p{background:#ffd34d}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.gem{font-size:28px;aspect-ratio:1;background:#3b1d52;color:white;border:0}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#13081d;padding:10px;border-radius:10px}.stat b{display:block;color:#ffd34d}</style></head>
<body><main><div class="box"><h1>💎 Gem Quest Online</h1><p id="status">Łączenie...</p></div>
<section id="login" class="box"><h2>👤 Konto gracza</h2><input id="email" type="email" placeholder="E-mail"><br><input id="pass" type="password" placeholder="Hasło (min. 6 znaków)"><br><input id="nick" placeholder="Nazwa gracza"><br><button class="p" onclick="reg()">Utwórz konto</button><button onclick="log()">Zaloguj</button><p id="msg"></p></section>
<section id="game" class="box" hidden><p>👤 <b id="name"></b> <button onclick="out()">Wyloguj</button></p><div class="stats"><div class="stat">Poziom<b id="level">1</b></div><div class="stat">XP<b id="xp">0</b></div><div class="stat">🪙<b id="coins">1000</b></div><div class="stat">💎<b id="crystals">25</b></div><div class="stat">🏆<b id="best">0</b></div></div><h2>Poziom <span id="lv">1</span></h2><p>🎯 Cel: <b id="goal">500</b> · Ruchy: <b id="moves">20</b></p><div id="board" class="board"></div><p id="gameMsg">Połącz 3 takie same klejnoty.</p></section>
<section id="shop" class="box" hidden><h2>🛍️ Sklep</h2><p>⭐ Premium — 19,99 zł/mies.</p><button class="p" onclick="demo()">Wykup Premium</button><p>⚡ Booster Pack — 9,99 zł</p><button class="p" onclick="demo()">Kup</button><br><small>Płatności są jeszcze demonstracyjne.</small></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://mcafqjvvjhnjefrnjbay.supabase.co","sb_publishable_UuHx3zdTFfHBWZ4B_J82sw_8f9dmNSV"),S=["🔴","🔵","🟢","🟡","🟣","🟠"];let B=[],sel=null,score=0,moves=20,P={level:1,xp:0,coins:1000,crystals:25,best_score:0},user=null;
const $=id=>document.getElementById(id);function say(x){$("msg").textContent=x}
async function reg(){let e=$("email").value.trim(),p=$("pass").value,n=$("nick").value.trim()||"Gracz";let r=await sb.auth.signUp({email:e,password:p,options:{data:{nickname:n}}});if(r.error)return say(r.error.message);say(r.data.session?"Konto utworzone.":"Sprawdź e-mail i potwierdź konto.")}
async function log(){let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)return say(r.error.message);open(r.data.user)}
async function open(u){user=u;let r=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();if(r.error)return say(r.error.message);if(!r.data){let q=await sb.from("profiles").insert({id:u.id,nickname:u.user_metadata.nickname||"Gracz"}).select().single();if(q.error)return say(q.error.message);r=q}P=r.data;$("name").textContent=P.nickname;$("status").textContent="Zalogowano";$("login").hidden=true;$("game").hidden=false;$("shop").hidden=false;newGame()}
async function out(){await sb.auth.signOut();location.reload()}function goal(){return 500+(P.level-1)*350}function newGame(){score=0;moves=20;sel=null;B=Array.from({length:64},()=>Math.floor(Math.random()*6));draw()}
function draw(){let x=$("board");x.innerHTML="";B.forEach((v,i)=>{let b=document.createElement("button");b.className="gem";b.textContent=S[v];b.onclick=()=>pick(i);x.appendChild(b)});[["level",P.level],["lv",P.level],["xp",P.xp],["coins",P.coins],["crystals",P.crystals],["best",P.best_score],["moves",moves],["goal",goal()]].forEach(a=>$(a[0]).textContent=a[1])}
function find(){let q=new Set();for(let r=0;r<8;r++)for(let c=0;c<6;c++){let i=r*8+c;if(B[i]==B[i+1]&&B[i]==B[i+2])for(let k=c;k<8&&B[r*8+k]==B[i];k++)q.add(r*8+k)}for(let c=0;c<8;c++)for(let r=0;r<6;r++){let i=r*8+c;if(B[i]==B[i+8]&&B[i]==B[i+16])for(let k=r;k<8&&B[k*8+c]==B[i];k++)q.add(k*8+c)}return q}
function pick(i){if(!moves)return;if(sel===null){sel=i;return}let a=sel;sel=null;let r1=Math.floor(a/8),c1=a%8,r2=Math.floor(i/8),c2=i%8;if(Math.abs(r1-r2)+Math.abs(c1-c2)!=1)return;[B[a],B[i]]=[B[i],B[a]];let q=find();if(!q.size){[B[a],B[i]]=[B[i],B[a]];$("gameMsg").textContent="Brak kombinacji.";return}moves--;score+=q.size*10;P.xp+=q.size*2;P.coins+=q.size;P.best_score=Math.max(P.best_score,score);q.forEach(i=>B[i]=Math.floor(Math.random()*6));if(score>=goal()){P.level++;P.crystals+=5;P.coins+=100;newGame()}draw();save()}
async function save(){if(user)await sb.from("profiles").update(P).eq("id",user.id)}function demo(){alert("DEMO — pieniądze nie są pobierane. Prawdziwe płatności dodamy później.")}
sb.auth.getSession().then(r=>{if(r.data.session)open(r.data.session.user);else $("status").textContent="Nie zalogowano"});
</script></main></body></html>
