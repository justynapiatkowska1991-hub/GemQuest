<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Film Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎬 <span>AI Film Studio</span></div>
    <button class="new-btn" id="newProject">+ Nowy film</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <button class="nav active">🎬 Nowy film</button>
      <button class="nav">📁 Moje projekty</button>
      <button class="nav">👤 Moi bohaterowie</button>
      <button class="nav">🌍 Moje światy</button>
      <button class="nav">🎙️ Głosy</button>
      <button class="nav">🎵 Muzyka</button>
      <button class="nav">⚙️ Ustawienia</button>
    </aside>

    <section class="content">
      <div class="hero">
        <p class="eyebrow">TWÓRCZE STUDIO AI</p>
        <h1>Stwórz własny film.</h1>
        <p>Pomysł → scenariusz → bohaterowie → sceny → dźwięk → gotowy film.</p>
      </div>

      <div class="card">
        <h2>Nowy projekt</h2>

        <label>Tytuł filmu
          <input id="title" placeholder="np. Moje nowe życie">
        </label>

        <label>Pomysł na film
          <textarea id="idea" rows="5" placeholder="Opisz historię, którą chcesz stworzyć..."></textarea>
        </label>

        <div class="grid">
          <label>Długość
            <select id="duration">
              <option>30 sekund</option>
              <option>1 minuta</option>
              <option selected>3 minuty</option>
              <option>5 minut</option>
              <option>10 minut</option>
            </select>
          </label>

          <label>Format
            <select id="format">
              <option selected>9:16 — pionowy</option>
              <option>16:9 — poziomy</option>
              <option>1:1 — kwadrat</option>
            </select>
          </label>

          <label>Styl
            <select id="style">
              <option selected>Filmowy realistyczny</option>
              <option>Romantyczny</option>
              <option>Thriller</option>
              <option>Fantasy</option>
              <option>Komediowy</option>
              <option>Dokumentalny</option>
            </select>
          </label>
        </div>

        <button class="generate" id="generate">✨ Przygotuj projekt</button>
      </div>

      <div class="pipeline">
        <div>1. 📝 Scenariusz</div>
        <div>2. 👤 Bohaterowie</div>
        <div>3. 🎥 Sceny</div>
        <div>4. 🎙️ Dźwięk</div>
        <div>5. ✂️ Montaż</div>
        <div>6. 📤 Eksport</div>
      </div>

      <div class="status" id="status">Gotowe. Czekam na Twój pomysł.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
